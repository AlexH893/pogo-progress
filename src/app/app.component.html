<div class="app-layout">
  <div class="grid-overlay"></div>
  <header class="header">
    <nav class="nav-pill">
      <div class="nav-brand">
        <!-- Logo -->
        <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M2 12h8"></path>
          <path d="M14 12h8"></path>
          <circle cx="12" cy="12" r="2"></circle>
        </svg>
        <span class="brand-text">PogoProgress</span>
      </div>
      
      <div class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link" title="Upload">Upload</a>
        <a routerLink="/logbook" routerLinkActive="active" class="nav-link" title="Data Logbook">Logbook</a>
        <a routerLink="/settings" routerLinkActive="active" class="nav-link" title="Settings">Settings</a>
      </div>

      <div class="nav-auth">
        <button 
          class="theme-toggle" 
          (click)="toggleDarkMode()" 
          [title]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
          [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
          <!-- Sun icon (shown in dark mode to switch back to light) -->
          <svg *ngIf="isDarkMode" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Moon icon (shown in light mode to switch to dark) -->
          <svg *ngIf="!isDarkMode" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <ng-container *ngIf="user$ | async as user; else guestMode">
          <div class="user-profile" [title]="user.email">
            <div class="avatar">
              {{ user.name.charAt(0).toUpperCase() }}
            </div>
            <button class="btn-pill btn-pill--outline" (click)="signOut()">Sign Out</button>
          </div>
        </ng-container>
        <ng-template #guestMode>
          <div id="google-signin-btn"></div>
        </ng-template>
      </div>
    </nav>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
<app-toast></app-toast>
